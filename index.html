            {"@type": "Question", "name": "What are the three classes of e-bikes in Florida?", "acceptedAnswer": {"@type": "Answer", "text": "Florida law (section 316.003) recognizes three, all with working pedals and a motor under 750 watts. Class 1 is pedal-assist only and the motor stops helping at 20 mph. Class 2 adds a throttle, so the motor can move the bike without pedaling, also up to 20 mph. Class 3 is pedal-assist only up to 28 mph and must have a speedometer."}},
            {"@type": "Question", "name": "Which e-bike class is most important to insure?", "acceptedAnswer": {"@type": "Answer", "text": "Class 3. At 28 mph it is the fastest and some carriers treat it more like a moped, so coverage terms and price vary the most. A Class 2's throttle also draws more scrutiny than a basic Class 1, but we write all three."}},
            {"@type": "Question", "name": "Does my e-bike's class affect my coverage or rate?", "acceptedAnswer": {"@type": "Answer", "text": "It can. Carriers look at top assisted speed and whether the bike has a throttle when they judge liability risk, so a Class 3 often rates differently than a Class 1. Tell us the class when you request a quote and we will match the right policy."}},
            {"@type": "Question", "name": "How do I tell which class my e-bike is?", "acceptedAnswer": {"@type": "Answer", "text": "Most e-bikes carry a manufacturer label listing the class and top assisted speed. A top speed of 20 mph means Class 1 (no throttle) or Class 2 (throttle); 28 mph with a speedometer means Class 3. If you are unsure, send us the make and model and we will confirm."}},
            {"@type": "Question", "name": "Do I need a license, registration, or insurance for an e-bike in Florida?", "acceptedAnswer": {"@type": "Answer", "text": "No. Florida gives all three classes the same rights and duties as a regular bicycle: no driver's license, no registration, and no state-required insurance. But the state not requiring coverage does not mean you are protected: theft, liability, and battery damage are still your responsibility, which is exactly what an e-bike policy covers."}},
